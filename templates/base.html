<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}HelpDesk Pro{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">انتقل إلى المحتوى</a>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="{{ url_for('ticket_list') }}">
        <svg class="brand__mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
          <rect width="40" height="40" rx="10" fill="#0b7285"/>
          <path d="M11 13.5a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-7l-5 4v-4h0a3 3 0 0 1-3-3z" fill="#fff"/>
          <path d="M15.5 18.2l2.6 2.6 5.6-5.6" fill="none" stroke="#0b7285" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand__text">
          <span class="brand__name" lang="en" dir="ltr">HelpDesk Pro</span>
          <span class="brand__tagline">بلاغات دعم فني تجريبية</span>
        </span>
      </a>
      <nav aria-label="التنقل الرئيسي">
        <ul class="nav">
          <li><a href="{{ url_for('ticket_list') }}"{% if active_page == "list" %} aria-current="page"{% endif %}>البلاغات</a></li>
          <li><a href="{{ url_for('ticket_new') }}"{% if active_page == "new" %} aria-current="page"{% endif %}>إنشاء بلاغ</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="main" class="container" tabindex="-1">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <div class="container">تطبيق محلي للتجربة دون حسابات أو صلاحيات؛ استخدم بيانات خيالية فقط.</div>
  </footer>
</body>
</html>
